title: "The Excel Catastrophe"
description: >
  Your first day at the consultancy. The client has sent over a 10,000-row spreadsheet representing ten years of sales data. 
  Unfortunately, dates are mixed formats (some US, some UK, some just 'Tuesday'), prices have currency symbols randomly attached, 
  and there are nulls everywhere. You need to propose a robust cleaning strategy.
difficulty: "Easy"
npcs:
  - name: "Todd"
    role: "Client Project Manager"
    personality: "Anxious, tech-illiterate"
    background: "Believes Excel can solve everything. Worried about project timelines."
  - name: "Sarah"
    role: "Senior Consultant (Your Mentor)"
    personality: "Supportive but demanding"
    background: "Expects scalable Python solutions (Pandas/Polars) rather than manual fixes."
